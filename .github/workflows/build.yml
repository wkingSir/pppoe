name: Build EXE on Windows
on: [push, workflow_dispatch] # 支持推送到仓库触发，也支持手动在网页点击触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. 检出代码 (升级到 v4)
      - uses: actions/checkout@v4

      # 2. 设置 Python 环境 (升级到 v5)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 推荐使用 3.11，打包出的 exe 兼容性较好

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      # 4. 执行打包命令
      - name: Build EXE
        run: |
          pyinstaller --onefile --console --key="2wsxcde3" --name "拨号流量助手" auth_generator.py

      # 5. 上传生成的 EXE (必须使用 v4)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dialer-exe-package  # 下载时的压缩包名称
          path: dist/拨号流量助手.exe  # 对应 pyinstaller 生成的路径
          retention-days: 5         # 文件保留天数